services:
  - type: web
    name: connect-four-backend
    runtime: go
    buildCommand: cd backend && go build -o main .
    startCommand: cd backend && ./main
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: connect-four-db
          property: connectionString
      - key: KAFKA_BROKERS
        value: localhost:9092
      - key: KAFKA_TOPIC
        value: game-analytics
      - key: MATCHMAKING_TIMEOUT
        value: 10000
      - key: RECONNECTION_TIMEOUT
        value: 30000
    healthCheckPath: /health
